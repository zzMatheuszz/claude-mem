# Claude Code com memória persistente entre execuções.
# Coloque este arquivo em .github/workflows/claude.yml no seu repositório.
# Pré-requisito: um secret ANTHROPIC_API_KEY em Settings > Secrets and variables > Actions.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Só roda quando alguém menciona @claude E tem acesso de escrita ao repositório.
    # A memória salva aqui é lida pelas próximas execuções, então estranhos não podem disparar.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Restaura a memória antes do agente rodar e salva de volta no fim do job (mesmo se falhar).
      - name: Claude Code memory
        uses: CVector-Energy/claude-code-memory@v0.1.0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
